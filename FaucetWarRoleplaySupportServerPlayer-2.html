<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faucet War Roleplay — Player</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0d1117;color:#e6edf3}header{padding:18px;background:#161b22;border-bottom:1px solid #30363d;text-align:center}.wrap{max-width:620px;margin:auto;padding:20px}.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:22px;margin-top:25px}input{width:100%;padding:13px;background:#0d1117;color:#fff;border:1px solid #30363d;border-radius:9px;margin:10px 0 14px}button{width:100%;padding:13px;border:0;border-radius:9px;background:#eab308;color:#111;font-weight:700}.status{margin-top:16px;padding:14px;border-radius:9px;background:#30363d;line-height:1.6}.good{border:1px solid #22c55e}.bad{border:1px solid #ef4444}.muted{color:#8b949e}</style></head><body>
<header><b>Faucet War Roleplay Support Server</b><br><span class="muted">Player Reports</span></header>
<div class="wrap">
  <div class="card">
    <h2>Report a Player</h2>
    <p class="muted">Enter your Roblox username and the details of the player you want to report.</p>

    <input id="reporterUsername" placeholder="Your Roblox Username" autocomplete="off">
    <input id="reportedUsername" placeholder="Player Username" autocomplete="off">
    <input id="reportedId" placeholder="Player ID (10 digits)" inputmode="numeric" maxlength="10" autocomplete="off">
    <input id="reason" placeholder="Reason for report" autocomplete="off">

    <button onclick="submitReport()">Submit Report</button>
    <div id="reportResult" class="status">Waiting for report...</div>
  </div>
</div>

<script>
function esc(v){
  return String(v).replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function submitReport(){
  const reporter=document.getElementById('reporterUsername').value.trim();
  const target=document.getElementById('reportedUsername').value.trim();
  const id=document.getElementById('reportedId').value.trim();
  const reason=document.getElementById('reason').value.trim();
  const out=document.getElementById('reportResult');

  if(!reporter || !target || !id || !reason){
    out.className='status bad';
    out.textContent='Please complete all report fields.';
    return;
  }

  if(!/^\d{10}$/.test(id)){
    out.className='status bad';
    out.textContent='Player ID must be exactly 10 digits.';
    return;
  }

  const report={
    reporterUsername:reporter,
    playerUsername:target,
    playerId:id,
    reason:reason,
    createdAt:new Date().toISOString()
  };

  const key='SYS_PANEL_DATABASE_V5';
  let db={
    users:[],
    bugReports:[],
    playerReports:[],
    bans:[],
    history:[],
    notifications:[]
  };

  try{
    const saved=localStorage.getItem(key);
    if(saved) db=Object.assign(db,JSON.parse(saved));
  }catch(e){}

  if(!Array.isArray(db.playerReports)) db.playerReports=[];
  db.playerReports.push(report);
  localStorage.setItem(key,JSON.stringify(db));

  out.className='status good';
  out.innerHTML='<b>Report Submitted</b><br>Reported by: <b>'+esc(reporter)+'</b>';

  document.getElementById('reporterUsername').value='';
  document.getElementById('reportedUsername').value='';
  document.getElementById('reportedId').value='';
  document.getElementById('reason').value='';
}
</script>
</body></html>
