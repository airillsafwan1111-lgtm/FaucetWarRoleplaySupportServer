<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faucet War Roleplay — Player</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0d1117;color:#e6edf3}header{padding:18px;background:#161b22;border-bottom:1px solid #30363d;text-align:center}.wrap{max-width:620px;margin:auto;padding:20px}.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:22px;margin-top:25px}input{width:100%;padding:13px;background:#0d1117;color:#fff;border:1px solid #30363d;border-radius:9px;margin:10px 0 14px}button{width:100%;padding:13px;border:0;border-radius:9px;background:#eab308;color:#111;font-weight:700}.status{margin-top:16px;padding:14px;border-radius:9px;background:#30363d;line-height:1.6}.good{border:1px solid #22c55e}.bad{border:1px solid #ef4444}.muted{color:#8b949e}</style></head><body>
<header><b>Faucet War Roleplay Support Server</b><br><span class="muted">Player Verification</span></header>
<div class="wrap"><div class="card"><h2>Verify Roblox Username</h2><p class="muted">Enter your actual Roblox username. Display names are not accepted.</p>
<input id="username" placeholder="Roblox Username" autocomplete="off"><button onclick="verify()">Verify Username</button><div id="result" class="status">Waiting for verification...</div></div></div>
<script>
async function verify(){const input=document.getElementById('username'),result=document.getElementById('result'),username=input.value.trim();if(!username){result.className='status bad';result.textContent='Invalid: Please enter a Roblox username.';return}result.className='status';result.textContent='Checking Roblox username...';try{const r=await fetch('https://users.roblox.com/v1/usernames/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usernames:[username],excludeBannedUsers:false})});if(!r.ok)throw Error();const d=await r.json(),u=d.data&&d.data[0];if(!u||u.name.toLowerCase()!==username.toLowerCase()){result.className='status bad';result.innerHTML='<b>Invalid Username</b><br>This Roblox username was not found.';return}result.className='status good';result.innerHTML='<b>Player Verified</b><br>Username: <b>'+esc(u.name)+'</b><br>Roblox User ID: <b>'+esc(u.id)+'</b>'}catch(e){result.className='status bad';result.innerHTML='<b>Verification unavailable</b><br>Roblox could not be reached. Please try again.'}}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
