<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FWR Support Server — Player</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0d1117;color:#e6edf3}header{background:#161b22;border-bottom:1px solid #30363d;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.brand{font-weight:800}.sub{font-size:12px;color:#8b949e;margin-top:3px}.wrap{max-width:680px;margin:auto;padding:12px}.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:16px;margin:12px 0}button{border:0;border-radius:9px;padding:11px 13px;background:#eab308;color:#111;font-weight:700;cursor:pointer}.menuBtn{background:#30363d;color:#fff}input,textarea{width:100%;padding:13px;margin:8px 0 13px;background:#0d1117;color:#fff;border:1px solid #30363d;border-radius:9px;font-family:inherit}textarea{min-height:120px;resize:vertical}.hidden{display:none}.muted{color:#8b949e}.status{margin-top:13px;padding:12px;border-radius:9px;background:#30363d;line-height:1.5}.good{border:1px solid #22c55e}.bad{border:1px solid #ef4444}.menu{display:grid;grid-template-columns:1fr 1fr;gap:9px}.menu button{width:100%}@media(max-width:480px){.menu{grid-template-columns:1fr}.card{padding:13px}h2{font-size:20px}}</style></head><body>
<header><div><div class="brand">FWR SUPPORT SERVER</div><div class="sub">Player Support</div></div><button class="menuBtn" onclick="toggleMenu()">☰ Menu</button></header>
<div id="menu" class="wrap hidden"><div class="card"><div class="menu"><button onclick="show('bug')">🐛 Report Bug</button><button onclick="show('player')">👤 Report Player</button></div></div></div>
<div class="wrap">
<section id="bug" class="card"><h2>🐛 Report Bug</h2><p class="muted">Report an in-game bug. Your username is saved with the report.</p>
<input id="bugReporter" placeholder="Your Roblox Username"><input id="gameName" placeholder="Game Name"><input id="bugTitle" placeholder="Bug Title"><textarea id="bugDescription" placeholder="Describe the bug"></textarea><input id="bugEvidence" placeholder="Evidence / Video / Screenshot (optional)"><button onclick="submitBug()">Submit Bug Report</button><div id="bugResult" class="status">Waiting for report...</div></section>
<section id="player" class="card hidden"><h2>👤 Report a Player</h2><p class="muted">Report a player and include their 10-digit Player ID.</p>
<input id="playerReporter" placeholder="Your Roblox Username"><input id="reportedUsername" placeholder="Player Username"><input id="reportedId" placeholder="Player ID (10 digits)" inputmode="numeric" maxlength="10"><textarea id="reason" placeholder="Reason for report"></textarea><button onclick="submitPlayer()">Submit Player Report</button><div id="playerResult" class="status">Waiting for report...</div></section>
</div>
<script>
const KEY='FWR_SUPPORT_SERVER_DATABASE_V1';
const blank={users:[],bugReports:[],playerReports:[],bans:[],history:[],notifications:[]};
function getDB(){try{return Object.assign({},blank,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return JSON.parse(JSON.stringify(blank))}}
function saveDB(d){localStorage.setItem(KEY,JSON.stringify(d))}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function toggleMenu(){document.getElementById('menu').classList.toggle('hidden')}
function show(x){document.getElementById('bug').classList.toggle('hidden',x!=='bug');document.getElementById('player').classList.toggle('hidden',x!=='player');document.getElementById('menu').classList.add('hidden')}
function submitBug(){
 let reporter=bugReporter.value.trim(),game=gameName.value.trim(),title=bugTitle.value.trim(),desc=bugDescription.value.trim(),evidence=bugEvidence.value.trim(),out=bugResult;
 if(!reporter||!game||!title||!desc){out.className='status bad';out.textContent='Please complete all required fields.';return}
 let d=getDB();d.bugReports=Array.isArray(d.bugReports)?d.bugReports:[];
 d.bugReports.unshift({id:id(),reporterUsername:reporter,author:reporter,user:reporter,game,title,description:desc,evidence,status:'pending',date:new Date().toLocaleString()});saveDB(d);
 out.className='status good';out.innerHTML='<b>Bug Report Submitted</b><br>Reported by: <b>'+esc(reporter)+'</b>';
 bugReporter.value=gameName.value=bugTitle.value=bugDescription.value=bugEvidence.value='';
}
function submitPlayer(){
 let reporter=playerReporter.value.trim(),target=reportedUsername.value.trim(),pid=reportedId.value.trim(),why=reason.value.trim(),out=playerResult;
 if(!reporter||!target||!pid||!why){out.className='status bad';out.textContent='Please complete all required fields.';return}
 if(!/^\\d{10}$/.test(pid)){out.className='status bad';out.textContent='Player ID must be exactly 10 digits.';return}
 let d=getDB();d.playerReports=Array.isArray(d.playerReports)?d.playerReports:[];
 d.playerReports.unshift({id:id(),reporterUsername:reporter,author:reporter,user:target,playerUsername:target,pid:pid,playerId:pid,reason:why,status:'pending',date:new Date().toLocaleString()});saveDB(d);
 out.className='status good';out.innerHTML='<b>Player Report Submitted</b><br>Reported by: <b>'+esc(reporter)+'</b>';
 playerReporter.value=reportedUsername.value=reportedId.value=reason.value='';
}
</script></body></html>
